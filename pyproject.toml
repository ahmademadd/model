[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-classifier"
version = "0.1.0"
description = "Classify complete movement repetitions using a masked Keras TCN"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "tensorflow==2.19.1",
  "keras==3.10.0",
  "keras-tcn==3.5.6",
  "numpy>=1.26,<2.2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebooks = [
  "pandas",
  "matplotlib",
  "ipywidgets",
  "jupyterlab",
  "ipykernel",
]

[project.scripts]
activity-audit = "activity_classifier.audit:main"
activity-split = "activity_classifier.split:main"
activity-train = "activity_classifier.train:main"
activity-evaluate = "activity_classifier.evaluate:main"
activity-predict = "activity_classifier.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

